site_name: CeLEry
site_description: Recover the spatial origin of cells in single-cell RNA-seq with a deep neural network trained on spatial transcriptomics data.
site_url: https://qihuangzhang.github.io/CeLEry/
repo_url: https://github.com/QihuangZhang/CeLEry
repo_name: QihuangZhang/CeLEry
edit_uri: edit/main/docs/

docs_dir: docs

# With --strict, a link to a missing heading fails the build like a link to a missing page.
validation:
  anchors: warn

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  logo: assets/celery_icon.svg
  favicon: assets/favicon.ico

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Installation: install.md
      - Quick start: get-started.md
  - Tutorials:
      - Cell coordinates: tutorials/coordinates.md
      - Tissue layers: tutorials/layers.md
      - Spatial domains: tutorials/domains.md
      - Data augmentation: tutorials/augmentation.md
      - Pretrained brain model: tutorials/pretrained.md
  - Reference: reference.md
  - Articles:
      - Reading the output: reading-output.md
      - Reproducibility: reproducibility.md
      - Reproducing the paper: case-studies.md
      - Citation: citation.md
  - News: changelog.md
